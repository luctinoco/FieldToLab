<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha - FieldToLab</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin: 0 0 15px;
            color: #007BFF;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #007BFF, #0056b3);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: linear-gradient(135deg, #0056b3, #007BFF);
            transform: scale(1.05);
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Alterar Senha</h2>
        <form id="changePasswordForm">
            <label for="currentPassword">Senha Atual</label>
            <input type="password" id="currentPassword" name="currentPassword" placeholder="Digite sua senha atual" required>
            <label for="newPassword">Nova Senha</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Digite sua nova senha" required>
            <label for="confirmNewPassword">Confirmar Nova Senha</label>
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Confirme sua nova senha" required>
            <div class="error" id="passwordErrorMessage"></div>
            <button type="submit">Alterar Senha</button>
        </form>
    </div>
    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmNewPassword = document.getElementById('confirmNewPassword').value.trim();
            const passwordErrorMessage = document.getElementById('passwordErrorMessage');

            passwordErrorMessage.textContent = '';

            if (newPassword !== confirmNewPassword) {
                passwordErrorMessage.textContent = 'As novas senhas não correspondem!';
                return;
            }

            try {
                const response = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ currentPassword, newPassword }),
                });

                if (response.ok) {
                    alert('Senha alterada com sucesso! Faça login novamente.');
                    window.location.href = '/';
                } else {
                    const error = await response.json();
                    passwordErrorMessage.textContent = error.message || 'Erro ao alterar a senha.';
                }
            } catch (err) {
                console.error(err);
                passwordErrorMessage.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
